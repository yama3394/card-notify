{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:320px;margin:60px auto">
  <h2>ログイン</h2>
  {% if error %}
  <p style="color:#c00;margin-bottom:10px;font-size:13px">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" autocomplete="on">
    <input type="password" name="password" placeholder="パスワード"
           autocomplete="current-password" required style="margin-bottom:10px">
    <button type="submit" style="width:100%">ログイン</button>
  </form>
</div>
{% endblock %}
